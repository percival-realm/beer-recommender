name: Build and Push Docker Image

on:
  push:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # THERE IS NO `deploy` JOB ANY MORE, and that is deliberate rather than lost.
  #
  # It ssh'd to the shared production box and ran, in this order:
  #
  #     docker login ghcr.io …          <- rewrote THAT BOX'S registry credential
  #     cd ~/home-lab/services/beer-recommender
  #
  # That directory no longer exists. The service was hosted there once - the last run, 2026-04-08,
  # genuinely deployed - and was retired from the box afterwards without this workflow being told.
  # Nothing has been pushed here since, which is the only reason it has not been noticed.
  #
  # The next push would have re-pointed the production box's `~/.docker/config.json` at whatever
  # `GHCR_PAT` currently is, and only then failed on the missing directory. Rewriting a shared box's
  # credentials as a side effect of a deploy that cannot succeed is worth removing rather than
  # repairing, and the failure would have named the `cd` rather than the login.
  #
  # The image is still built and pushed to ghcr.io by the job above; only the install is gone.
  #
  # TO HOST THIS AGAIN, both halves land together: a `services/beer-recommender/` directory with a
  # compose file in percival-realm/home-lab, and this job restored. One without the other is the
  # state being removed here.
