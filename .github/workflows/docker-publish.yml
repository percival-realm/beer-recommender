name: Build and Push Docker Image

on:
  push:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # There is deliberately no `deploy` job here.
  #
  # One existed and installed this image onto a host that no longer runs the service. The last
  # successful deploy was 2026-04-08; the service was retired from that host afterwards and this
  # workflow was not updated, so the job could only fail. Nothing had been pushed here since, which
  # is why it went unnoticed.
  #
  # The image is still built and pushed to ghcr.io by the job above.
  #
  # To host this again, restore the job together with the hosting configuration it expects — one
  # without the other is the state that was removed.
